# Data-side inputs of the nuNCQE extraction (PRD draft, Oct 15 2026). '#' starts a comment.
# Sources: NCQE_XS_analysis_v3/results/08_systematics.json ("inputs"), paper Table V and Eqs. 25-28.

# Selected beam-on events in the signal window (first 26 bunches, +-1 sigma)
n_obs        772

# Beam-uncorrelated (CIT) background: 67 pre-beam clusters x 182/150 (livetime ratio); error = sqrt(67) x 182/150
d_cit        81.29333333333334
d_cit_err    9.93156136320524

# Skyshine in the signal region from the >2 sigma sideband timing fit (Sec. V B)
d_sky        13.952588005387733
d_sky_err    12.868699904856147

# nu_mu + nu_e flux integrated over energy and averaged over the FV [nu / cm^2 / POT]
flux_per_pot 2.08722e-8

# 16O nuclei in the FV (r < 0.7 m, |y| < 1.0 m, Gd-loaded water; thesis App. E)
n_targets    1.028e29

# 1: OOFV nuNCQE scaled with f (paper Eq. 26). 0: subtracted as background (pre-2026-10-09, cross-checks only)
scale_oofv   1
